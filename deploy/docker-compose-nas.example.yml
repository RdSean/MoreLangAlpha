# Copy and adapt this file for a NAS deployment. Keep the NAS path outside the
# repository and grant the Docker daemon access to it.

services:
  postgres:
    volumes:
      - /mnt/tank/langalpha/postgres:/var/lib/postgresql/data
  redis:
    volumes:
      - /mnt/tank/langalpha/redis:/data
  minio:
    volumes:
      - /mnt/tank/langalpha/minio:/data
