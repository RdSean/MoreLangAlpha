# LangAlpha middleware: PostgreSQL, Redis, and MinIO.
# Run with the repository root as the working directory:
# docker compose --env-file deploy/.env -f deploy/docker-compose-middleware.yml up -d

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    volumes:
      # Mount PGDATA directly. The postgres image declares /var/lib/postgresql/data
      # as a VOLUME; mounting only its parent would otherwise create an anonymous
      # child volume and hide the migrated host data.
      - ${POSTGRES_DATA_DIR:-./volumes/postgresql/data}:/var/lib/postgresql/data
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - ${REDIS_DATA_DIR:-./volumes/redis}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - ${MINIO_DATA_DIR:-./volumes/minio}:/data
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-langalpha-education}
    volumes:
      - ./minio/init-education-bucket.sh:/init-education-bucket.sh:ro
    entrypoint: ["/bin/sh", "/init-education-bucket.sh"]

networks:
  default:
    name: langalpha-middleware
